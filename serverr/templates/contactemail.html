<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Contact Message</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      color: #333;
      padding: 20px;
    }
    .container {
      background-color: #fff;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #070706;
    }
    .message {
      margin-top: 10px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">New Contact Request Submitted</div>
    <p><strong>Name:</strong> {{name}}</p>
     <p><strong>Email:</strong> {{email}}</p>
      <p><strong>I Need Help  Regarding:</strong> {{help}}</p>
    <div class="message">
      <strong>Message:</strong>
      <p>{{message}}</p>
    </div>
  </div>
</body>
</html>
